plugins { id 'fabric-loom' version '1.10.5' }
version = '1.0.0'
group = 'buildcraft.tests'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    // This is the complete remapped distributable, copied by scripts/full-smoke.ps1.
    modImplementation files('../../verification/buildcraft-under-test.jar')
    // Loom strips nested jars while remapping a development dependency. Use the
    // dependencies extracted from that exact artifact, not project/source substitutes.
    modImplementation fileTree(dir: '../../verification/full-test-libs', include: '*.jar')
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
loom {
    runs {
        mapLocationClientSmoke {
            client()
            runDir '../../verification/map-location-client-run'
            vmArg '-Dbuildcraft.mapLocationClientSmoke=true'
        }
        guideResourceClientSmoke {
            client()
            runDir '../../verification/guide-resource-client-run'
            vmArg '-Dbuildcraft.guideResourceClientSmoke=true'
        }
        plannerClientSmoke {
            client()
            runDir '../../verification/planner-client-run'
            vmArg '-Dbuildcraft.plannerClientSmoke=true'
        }
        libraryClientSmoke {
            client()
            runDir '../../verification/library-client-run'
            vmArg '-Dbuildcraft.libraryClientSmoke=true'
        }
        replacerClientSmoke {
            client()
            runDir '../../verification/replacer-client-run'
            vmArg '-Dbuildcraft.replacerClientSmoke=true'
        }
        entityBlueprintClientSmoke {
            client()
            runDir '../../verification/entity-blueprint-client-run'
            vmArg '-Dbuildcraft.entityBlueprintClientSmoke=true'
        }
        builderClientSmoke {
            client()
            runDir '../../verification/builder-client-run'
            vmArg '-Dbuildcraft.builderClientSmoke=true'
        }
        architectClientSmoke {
            client()
            runDir '../../verification/architect-client-run'
            vmArg '-Dbuildcraft.architectClientSmoke=true'
        }
        fillerClientSmoke {
            client()
            runDir '../../verification/filler-client-run'
            vmArg '-Dbuildcraft.fillerClientSmoke=true'
        }
        stripesClientSmoke {
            client()
            runDir '../../verification/stripes-client-run'
            vmArg '-Dbuildcraft.stripesClientSmoke=true'
        }
        obsidianClientSmoke {
            client()
            runDir '../../verification/obsidian-client-run'
            vmArg '-Dbuildcraft.obsidianClientSmoke=true'
        }
        floodGateClientSmoke {
            client()
            runDir '../../verification/flood-gate-client-run'
            vmArg '-Dbuildcraft.floodGateClientSmoke=true'
        }
        gateCopierClientSmoke {
            client()
            runDir '../../verification/gate-copier-client-run'
            vmArg '-Dbuildcraft.gateCopierClientSmoke=true'
        }
        facadeClientSmoke {
            client()
            runDir '../../verification/facades-client-run'
