plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '1.0.0'
group = 'buildcraft.tests'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    implementation 'junit:junit:4.13.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// This is a test fixture, not the distributable BuildCraft mod. It loads the real
// Minecraft/Fabric classes and access wideners while full-port compilation proceeds.
// The root build still compiles all production sources without exclusions.
sourceSets.main.java {
    srcDir '../../common'
    srcDir '../../BuildCraftAPI/api'
    srcDir '../../src/test/java'
    include 'buildcraft/test/PortTestRunner.java'
    include 'buildcraft/lib/net/PacketBufferBC.java'
    include 'buildcraft/lib/net/TickTaskQueue.java'
    include 'buildcraft/lib/net/cache/*.java'
    include 'buildcraft/lib/compat/FluidStackBC.java'
    include 'buildcraft/lib/compat/FluidRegistryBC.java'
    include 'buildcraft/lib/compat/BCFluidStorage.java'
    include 'buildcraft/test/lib/net/NetworkedCacheTest.java'
    include 'buildcraft/test/lib/net/TickTaskQueueTest.java'
    include 'buildcraft/lib/net/PacketPayload.java'
    include 'buildcraft/lib/net/IPayloadWriter.java'
    include 'buildcraft/lib/net/IPayloadReceiver.java'
    include 'buildcraft/lib/net/IContainerPayloadReceiver.java'
    include 'buildcraft/lib/net/NetworkContext.java'
    include 'buildcraft/lib/net/NetworkRouting.java'
    include 'buildcraft/lib/net/MessageUpdateTile.java'
    include 'buildcraft/lib/net/MessageContainer.java'
    include 'buildcraft/lib/net/MessageMarker.java'
    include 'buildcraft/test/lib/net/MarkerPacketTest.java'
    include 'buildcraft/test/lib/net/PacketCodecTest.java'
    include 'buildcraft/test/lib/world/NetworkGameTests.java'
    include 'buildcraft/lib/config/Configuration.java'
    include 'buildcraft/lib/config/ConfigCategory.java'
    include 'buildcraft/lib/config/Property.java'
    include 'buildcraft/lib/config/EnumRestartRequirement.java'
    include 'buildcraft/lib/misc/ConfigUtil.java'
    include 'buildcraft/api/core/BCLog.java'
    include 'buildcraft/test/lib/config/ConfigurationTest.java'
    include 'buildcraft/test/lib/world/MiningGameTests.java'
    include 'buildcraft/api/core/IFakePlayerProvider.java'
    include 'buildcraft/lib/misc/FakePlayerProvider.java'
    include 'buildcraft/lib/misc/BlockUtil.java'
    include 'buildcraft/api/mj/MjAPI.java'
    include 'buildcraft/api/mj/MjBattery.java'
    include 'buildcraft/api/mj/MjCapabilityHelper.java'
    include 'buildcraft/api/mj/IMjConnector.java'
    include 'buildcraft/api/mj/IMjReceiver.java'
    include 'buildcraft/api/mj/IMjReadable.java'
    include 'buildcraft/api/mj/IMjRedstoneReceiver.java'
    include 'buildcraft/api/mj/IMjEffectManager.java'
    include 'buildcraft/lib/mj/MjBatteryReceiver.java'
    include 'buildcraft/lib/engine/EngineConnector.java'
    include 'buildcraft/lib/cap/CapabilityHelper.java'
    include 'buildcraft/test/lib/mj/MjConnectionTest.java'
    include 'buildcraft/api/core/IStackFilter.java'
    include 'buildcraft/api/core/EnumPipePart.java'
    include 'buildcraft/api/items/INamedItem.java'
    include 'buildcraft/api/items/IList.java'
    include 'buildcraft/api/lists/ListMatchHandler.java'
    include 'buildcraft/api/lists/ListRegistry.java'
    include 'buildcraft/api/recipes/IngredientStack.java'
    include 'buildcraft/lib/list/ListHandler.java'
    include 'buildcraft/lib/list/ListMatchHandlerClass.java'
    include 'buildcraft/lib/misc/StackUtil.java'
    include 'buildcraft/test/lib/inventory/ListHandlerTest.java'
    include 'buildcraft/api/inventory/IItemTransactor.java'
    include 'buildcraft/lib/inventory/StorageItemTransactor.java'
    include 'buildcraft/lib/inventory/InventoryWrapper.java'
    include 'buildcraft/lib/misc/data/CompactingBitSet.java'
    include 'buildcraft/lib/misc/data/DecompactingBitSet.java'
    include 'buildcraft/test/lib/inventory/StorageItemTransactorTest.java'
    include 'buildcraft/test/lib/inventory/ItemHandlerManagerTest.java'
    include 'buildcraft/test/lib/inventory/IngredientNBTBCTest.java'
    include 'buildcraft/lib/recipe/IngredientNBTBC.java'
    include 'buildcraft/lib/script/ScriptResourceRoots.java'
    include 'buildcraft/test/lib/inventory/ScriptResourceRootsTest.java'
    include 'buildcraft/lib/tile/item/ItemHandlerManager.java'
    include 'buildcraft/lib/tile/item/ItemHandlerSimple.java'
    include 'buildcraft/lib/tile/item/IItemHandlerAdv.java'
    include 'buildcraft/lib/tile/item/StackChangeCallback.java'
    include 'buildcraft/lib/tile/item/StackInsertionChecker.java'
    include 'buildcraft/lib/tile/item/StackInsertionFunction.java'
    include 'buildcraft/test/lib/misc/data/CompactingBitSetTest.java'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

loom {
    runs {
        server {
            server()
            runDir '../../verification/port-tests-run'
            programArgs 'nogui'
        }
        gameTest {
            server()
            runDir '../../verification/gametest-run'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=../gametest-results.xml'
        }
    }
}
