tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

loom {
    accessWidenerPath = file('../../src/main/resources/buildcraft.accesswidener')
    runs {
        server {
            server()
            runDir '../../verification/port-tests-run'
            programArgs 'nogui'
        }
        gameTest {
            server()
            runDir '../../verification/gametest-run'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=../gametest-results.xml'
        }
    }
}

processResources {
    from('../../src/main/resources/buildcraft.accesswidener')
    from('../../buildcraft_resources') { include 'assets/buildcraftbuilders/compat/buildcraft/builders/**' }
}
