plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '1.0.0'
group = 'buildcraft.tests'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    implementation 'junit:junit:4.13.2'
    implementation project(':expression')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// This is a test fixture, not the distributable BuildCraft mod. It loads the real
// Minecraft/Fabric classes and access wideners while full-port compilation proceeds.
// The root build still compiles all production sources without exclusions.
sourceSets.main.java {
    srcDir '../../common'
    srcDir '../../BuildCraftAPI/api'
    srcDir '../../src/test/java'
    include 'buildcraft/test/PortTestRunner.java'
    include 'buildcraft/builders/snapshot/BuildingExecutor.java'
    include 'buildcraft/builders/snapshot/Snapshot.java'
    include 'buildcraft/builders/snapshot/Template.java'
