 *
 * -------------------------------------------------------------------------
 * BUILD SYSTEM: Fabric Loom 1.6 / Minecraft 1.20.1
 * -------------------------------------------------------------------------
 * Migrated from: ForgeGradle 2.3-SNAPSHOT / Minecraft 1.12.2
 *
 * Structure kept as a SINGLE compilation unit (all BC modules in one source
 * tree) to avoid touching any Java source files during Phase 1.  A true
 * per-module Gradle subproject split is planned for a later phase.
 *
 * sub_projects/expression is compiled as a separate subproject because it has
 * its own code generator that must run before the main compile step.
 * -------------------------------------------------------------------------
 */

plugins {
    // Fabric Loom replaces net.minecraftforge.gradle.forge
    alias(libs.plugins.fabric.loom)
    id 'maven-publish'
}

// ---------------------------------------------------------------------------
// Version
// ---------------------------------------------------------------------------
def baseVersion = "8.0.1-pre.2+mc1.20.1"
if (System.getenv("MOD_VERSION")) {
    version = System.getenv("MOD_VERSION")
} else if (!Boolean.getBoolean("release")) {
    // Append short git hash for non-release builds, matching old ForgeGradle behaviour.
    def gitProc = "git rev-parse --short=12 HEAD".execute([], rootDir)
    gitProc.waitFor()
    def hash = gitProc.exitValue() == 0 ? gitProc.text.trim() : ""
    version = hash ? "${baseVersion}-${hash}" : "${baseVersion}-SNAPSHOT"
} else {
    version = baseVersion
}
group            = "com.mod-buildcraft"
base.archivesName = "buildcraft"

// ---------------------------------------------------------------------------
// Java toolchain (Java 17 required by Fabric Loom 1.6 + Minecraft 1.20.1)
// ---------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// Fabric Loom configuration
// ---------------------------------------------------------------------------
loom {
    accessWidenerPath = file('src/main/resources/buildcraft.accesswidener')
    // Do NOT call splitEnvironmentSourceSets() here.
    // The Forge codebase uses @SideOnly inline on shared classes rather than
    // separate client/common source sets.  Splitting would break compilation
    // without touching Java.  Re-evaluate in Phase 2 after @SideOnly → @Environment
    // rename pass is complete.

    runs {
        client {
            client()
            setConfigName "BuildCraft Client"
            ideConfigGenerated true
            runDir "run"
            // Preserve original JVM tuning from the Forge runClient task
            vmArgs(
                "-Dbuildcraft.dev=true",
                "-XX:+UseG1GC",
                "-Xmx2G", "-Xms2G",
                "-XX:+UnlockExperimentalVMOptions",
                "-XX:G1NewSizePercent=20",
                "-XX:G1ReservePercent=20",
                "-XX:MaxGCPauseMillis=50",
                "-XX:G1HeapRegionSize=32M"
            )
        }
        server {
            server()
            setConfigName "BuildCraft Server"
            ideConfigGenerated true
            runDir "run"
        }
    }
}

// ---------------------------------------------------------------------------
// Source sets
// ---------------------------------------------------------------------------
// The old ForgeGradle build had three source sets: api, main, test.
// The api sourceSet (BuildCraftAPI/api) is folded into main here because
// Fabric has no concept of a separately-shipped API artifact at this stage.
// Re-split in a later phase when the API surface has been reworked.
sourceSets {
    main {
        java {
            srcDir "common"               // all eight BC modules
            srcDir "common_old_license"   // older MPL files
            srcDir "BuildCraftAPI/api"    // BC public API (was a separate sourceSet)
            // expression sources are compiled by :sub_projects:expression and
            // consumed via 'implementation project(...)' — do NOT list them here.
        }
        resources {
            // src/main/resources (fabric.mod.json + Fabric assets) is already the Java
            // plugin's default resources dir; re-declaring it here registers a second file
            // tree over the same dir and makes every entry a duplicate in processResources.
            srcDir "buildcraft_resources" // textures, models, blockstates, recipes
            // Legacy translations are converted to native JSON below.
            srcDir "BuildCraft-Localization"
            exclude "**/*.lang"
            // Guide page bodies are Markdown resources and must be included in the jar.
            exclude "README.md"
            srcDir "BuildCraftGuide/guide_resources"
            exclude "pack.png"
            exclude "pack.mcmeta"
        }
    }
    test {
        java {
            srcDir "src/test/java"
        }
    }
}

// Mixin annotation processing belongs to production sources only. Its default
// all-source-set discovery otherwise makes remapJar compile legacy Forge tests.
loom.mixin { add sourceSets.main, 'buildcraft-refmap.json' }

// ---------------------------------------------------------------------------
// Repositories
// ---------------------------------------------------------------------------
repositories {
    maven {
        name = "FabricMC"
        url  = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

// ---------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------
dependencies {
    // ---- Fabric toolchain (managed by Loom, not bundled in the output jar) ----
    minecraft libs.minecraft
    // Yarn mappings: the :v2 classifier selects the intermediary-mapped variant.
    mappings variantOf(libs.yarn.mappings) { classifier "v2" }
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api

    // ---- Energy API (Phase 3 — not yet referenced in Java source) ----
    // teamreborn:energy replaces net.minecraftforge.energy.{IEnergyStorage, CapabilityEnergy}.
    // It is declared here so the dependency chain is established; actual usage in
    // tile entities is part of the capability migration phase.
    modImplementation libs.team.reborn.energy
    // Runtime API: bundle it so the distributed mod has the same dependency as runClient.
    include libs.team.reborn.energy

    // ---- Annotation support ----
    // @Nonnull / @Nullable are used throughout; jsr305 must be on the compile
    // classpath.  It is NOT included in the output jar (annotation-only).
    implementation libs.jsr305

    // ---- Expression library (generated + compiled as a subproject) ----
    // This replaces the old inline srcDir approach.  Loom will put it on the
    // compile and runtime classpath; the jar will be included via remapping.
    implementation project(':sub_projects:expression')
    include project(':sub_projects:expression')

    // ---- Tests ----
    testImplementation libs.junit
}

// ---------------------------------------------------------------------------
// Expression source generation
// ---------------------------------------------------------------------------
// The expression subproject must generate its autogen sources before the root
// compileJava runs.  Declaring the project dependency handles compilation order,
// but we also need the generateSources task to have run first.
compileJava.dependsOn ':sub_projects:expression:generateSources'

// ---------------------------------------------------------------------------
// Resource processing
// ---------------------------------------------------------------------------
def legacyLanguageRoots = [file('buildcraft_resources'), file('BuildCraft-Localization'), file('BuildCraftGuide/guide_resources')]
def generatedLanguages = layout.buildDirectory.dir('generated/legacy-languages')
def convertLegacyLanguages = tasks.register('convertLegacyLanguages') {
    inputs.files(legacyLanguageRoots.collect { root -> fileTree(root) { include 'assets/*/lang/*.lang' } })
    outputs.dir(generatedLanguages)
    doLast {
        File output = generatedLanguages.get().asFile.canonicalFile
        if (!output.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
            throw new GradleException('Generated languages must stay inside the build directory')
        }
        delete(output)
        Map<String, Map<String, String>> languages = new TreeMap<>()
        legacyLanguageRoots.each { root ->
            fileTree(root) { include 'assets/*/lang/*.lang' }.files.sort().each { source ->
                String relative = root.toPath().relativize(source.toPath()).toString().replace('\\', '/')
                String target = relative.substring(0, relative.lastIndexOf('/') + 1) + source.name.toLowerCase(Locale.ROOT).replaceFirst(/\.lang$/, '.json')
                Map<String, String> entries = languages.computeIfAbsent(target) { new TreeMap<>() }
                source.readLines('UTF-8').each { line ->
                    if (line.startsWith('\uFEFF')) line = line.substring(1)
                    int split = line.indexOf('=')
                    if (split > 0 && !line.stripLeading().startsWith('#')) {
                        entries[line.substring(0, split)] = line.substring(split + 1)
                    }
                }
            }
        }
        languages.each { path, entries ->
            File destination = new File(output, path)
            destination.parentFile.mkdirs()
            destination.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n', 'UTF-8')
        }
    }
}

processResources {
    from(convertLegacyLanguages)
    inputs.property "version", project.version

    // Expand ${version} placeholder in fabric.mod.json (mirrors old mcmod.info expand)
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // mcmod.info is no longer processed — it will be removed by cleanup-forge.sh.
    // The old expand + copy logic for mcmod.info is intentionally dropped.
}

// ---------------------------------------------------------------------------
// Compiler options
// ---------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xmaxerrs" << "9999"
    // Suppress all lint warnings during the migration.  The Forge-era source
    // generates thousands of warnings against 1.20.1 APIs.  Re-enable per module
    // after each module's porting pass is complete.
    options.compilerArgs << "-Xlint:none"
    // Verbose diagnostics kept — useful when tracking down cascading errors
    options.compilerArgs << "-Xdiags:verbose"
}

// ---------------------------------------------------------------------------
// Main jar
// ---------------------------------------------------------------------------
jar {
    from("LICENSE")     { rename { "${it}_BuildCraft" } }
    from("LICENSE-NEW") { rename { "${it}_BuildCraft" } }
    manifest.attributes(
        "Implementation-Title":   "BuildCraft",
        "Implementation-Version": project.version
    )
}

// Only production dependencies are needed to remap the distributable.
tasks.named('remapJar') {
    classpath.setFrom(sourceSets.main.compileClasspath)
}

// ---------------------------------------------------------------------------
// Per-module convenience JARs
// ---------------------------------------------------------------------------
// These replace the old reobfJar-based module jars.  They are thin archives
// that slice the compiled output by package prefix — useful for consumers that
// want only a subset of BuildCraft.
//
// A true Gradle subproject split (where each module has its own compilation
// unit and can express inter-module dependencies) is deferred to a later phase
// because it requires Java-level changes (access modifiers, package refactoring).
["lib", "core", "builders", "energy", "factory", "silicon", "transport", "robotics"].each { mod ->
    tasks.register("${mod}Jar", Jar) {
        group       = "build (modules)"
        description = "Thin JAR containing only buildcraft.${mod} classes and its assets."
        archiveAppendix = mod
        dependsOn compileJava
        from(sourceSets.main.output) {
            include "buildcraft/${mod}/**"
        }
        // Also bundle the per-namespace assets so each module jar is self-contained
        from(sourceSets.main.resources.sourceDirectories) {
            include "assets/buildcraft${mod}/**"
            include "data/buildcraft${mod}/**"
        }
    }
}

// ---------------------------------------------------------------------------
// Checkstyle (optional — run via: ./gradlew checkstyleMain -PrunCheckstyle)
// ---------------------------------------------------------------------------
if (project.hasProperty("runCheckstyle")) {
    apply plugin: "checkstyle"
    checkstyle {
        configFile  = file("guidelines/buildcraft.checkstyle")
        // Upgraded from 7.2: 10.x supports Java 17 syntax.
        // NOTE: guidelines/buildcraft.checkstyle may need rule updates for 10.x.
        toolVersion = "10.12.4"
    }
}

// ---------------------------------------------------------------------------
// compileLibLeaf — compatibility alias for the complete production compilation
// ---------------------------------------------------------------------------
tasks.register("compileLibLeaf") {
    group       = "verification"
    description = "Compatibility alias: compile the complete production source tree."
    dependsOn compileJava
}

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------
publishing {
    repositories {
        maven {
            url = System.getenv("MAVEN_DIR")
                ? file(System.getenv("MAVEN_DIR"))
                : layout.buildDirectory.dir("maven").get().asFile
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId    = "com.mod-buildcraft"
            artifactId = "buildcraft"
            version    = project.version
            from components.java
        }
    }
}

// ---------------------------------------------------------------------------
// Utility tasks
// ---------------------------------------------------------------------------
tasks.register("printVersion") {
    group       = "help"
    description = "Prints the computed mod version. Add -Drelease=true to suppress the git hash suffix."
    doLast {
        println "Version = ${project.version}"
    }
}
